<div class="filter-modal">
	<div class="filter-modal__inner">
		<header class="filter-modal__header">
			<p class="filter-modal__title h3">Фильтры</p>
		</header>

		<form action="" class="filter-modal__form filter-modal-form">
			<div class="filter-modal-form__options">
				<div class="filter-modal-form__option">
					<p class="filter-modal-form__option-title">Цена</p>
					<div class="filter-modal-form__price-fields">
						<div class="filter-modal-form__price-field">
							<label for="min-price" class="filter-modal-form__price-label">Минимальная цена</label>
							<input type="number" id="min-price" name="min-price" class="filter-modal-form__price-input" placeholder="Введите цену" min="0" max="200000">
						</div>
						<div class="filter-modal-form__price-field">
							<label for="max-price" class="filter-modal-form__price-label">Максимальная цена</label>
							<input type="number" id="max-price" name="max-price" class="filter-modal-form__price-input" placeholder="Введите цену" min="0" max="200000">
						</div>
					</div>
				</div>

				<div class="filter-modal-form__option">
					<p class="filter-modal-form__option-title">Модель</p>
					<div class="filter-modal-form__option-fields">
						<label class="filter-modal-form__option-label model-button" data-model="iphone-11">
							<input type="checkbox" name="model" value="iPhone 11" class="model-button__input">
							<span class="model-button__text">iPhone 11</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-12">
							<input type="checkbox" name="model" value="iPhone 12" class="model-button__input">
							<span class="model-button__text">iPhone 12</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-13">
							<input type="checkbox" name="model" value="iPhone 13" class="model-button__input">
							<span class="model-button__text">iPhone 13</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-14">
							<input type="checkbox" name="model" value="iPhone 14" class="model-button__input">
							<span class="model-button__text">iPhone 14</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-15">
							<input type="checkbox" name="model" value="iPhone 16" class="model-button__input">
							<span class="model-button__text">iPhone 15</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-16">
							<input type="checkbox" name="model" value="iPhone 16" class="model-button__input">
							<span class="model-button__text">iPhone 16</span>
						</label>
						<label class="filter-modal-form__option-label model-button" data-model="iphone-se3">
							<input type="checkbox" name="model" value="iPhone SE3" class="model-button__input">
							<span class="model-button__text">iPhone SE3</span>
						</label>
					</div>
				</div>
			</div>

			<div class="filter-modal-form__buttons">
				<button type="button" class="filter-modal-form__button filter-modal-form__button-apply button button--small">
					<span class="button__text">Применить</span>
				</button>
				<button type="reset" class="filter-modal-form__button filter-modal-form__button-reset button button--transparent button--small">
					<span class="button__text">Сбросить</span>
				</button>
			</div>
		</form>
	</div>
</div>
